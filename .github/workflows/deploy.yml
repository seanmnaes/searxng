name: Deploy SearXNG

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 11 * * *'  # Daily at 04:00 PDT (11:00 UTC)
  workflow_dispatch:

env:
  TF_CLOUD_ORGANIZATION: "catlan"
  TF_WORKSPACE: "searxng-pipeline"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -no-color
        env:
          TF_VAR_linode_token: ${{ secrets.LI_API_TOKEN }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CF_ZONE_ID }}
          TF_VAR_root_password: ${{ secrets.LINODE_ROOT_PASSWORD }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_deploy_timestamp: ${{ github.run_id }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color
        env:
          TF_VAR_linode_token: ${{ secrets.LI_API_TOKEN }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CF_ZONE_ID }}
          TF_VAR_root_password: ${{ secrets.LINODE_ROOT_PASSWORD }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_deploy_timestamp: ${{ github.run_id }}
