name: Deploy SearXNG

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 11 * * *'  # Daily at 04:00 PDT (11:00 UTC)
  workflow_dispatch:

# Least privilege: this workflow only needs to read the repo for checkout.
# It authenticates to Terraform/Linode/Cloudflare via dedicated secrets, not GITHUB_TOKEN.
permissions:
  contents: read

# Queue overlapping runs (push + cron) instead of racing the Terraform Cloud state lock.
# Never cancel an in-flight apply.
concurrency:
  group: deploy-searxng
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init
        env:
          TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORG }}
          TF_WORKSPACE: ${{ vars.TF_CLOUD_WORKSPACE }}

      - name: Terraform Plan
        run: terraform plan -no-color -lock-timeout=5m
        env:
          TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORG }}
          TF_WORKSPACE: ${{ vars.TF_CLOUD_WORKSPACE }}
          TF_VAR_linode_token: ${{ secrets.LI_API_TOKEN }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CF_ZONE_ID }}
          TF_VAR_root_password: ${{ secrets.LINODE_ROOT_PASSWORD }}
          TF_VAR_domain: ${{ vars.DOMAIN }}
          TF_VAR_deploy_timestamp: ${{ github.run_id }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color -lock-timeout=5m
        env:
          TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORG }}
          TF_WORKSPACE: ${{ vars.TF_CLOUD_WORKSPACE }}
          TF_VAR_linode_token: ${{ secrets.LI_API_TOKEN }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ vars.CF_ZONE_ID }}
          TF_VAR_root_password: ${{ secrets.LINODE_ROOT_PASSWORD }}
          TF_VAR_domain: ${{ vars.DOMAIN }}
          TF_VAR_deploy_timestamp: ${{ github.run_id }}

      # The instance is recreated on every apply and the StackScript boots asynchronously,
      # so a green apply does not mean the site is up. Poll the public URL and fail the job
      # if the origin never becomes healthy (turns a silently-broken boot into a red deploy).
      - name: Health check
        run: |
          set -eu
          URL="https://${{ vars.DOMAIN }}/"
          for i in $(seq 1 40); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || echo 000)
            echo "attempt $i: HTTP $CODE"
            [ "$CODE" = "200" ] && { echo "origin healthy"; exit 0; }
            sleep 15
          done
          echo "::error::Site did not return 200 within ~10 minutes after apply"
          exit 1
