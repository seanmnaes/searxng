name: Rotate Secrets

on:
  schedule:
    - cron: '0 12 */28 * *'  # Every 28 days at 05:00 PDT (12:00 UTC)
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: pip install pynacl

      - name: Rotate Linode API Token
        env:
          LI_API_TOKEN: ${{ secrets.LI_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Create new token (expires in 60 days to allow overlap)
          EXPIRY=$(date -u -d "+60 days" +%Y-%m-%dT%H:%M:%S)
          RESPONSE=$(curl -s -X POST "https://api.linode.com/v4/profile/tokens" \
            -H "Authorization: Bearer $LI_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"label\":\"searxng-pipeline-$(date +%Y%m%d)\",\"expiry\":\"$EXPIRY\",\"scopes\":\"linodes:read_write stackscripts:read_write events:read_only firewall:read_write\"}")

          NEW_TOKEN=$(echo "$RESPONSE" | jq -r '.token')
          NEW_TOKEN_ID=$(echo "$RESPONSE" | jq -r '.id')
          if [ "$NEW_TOKEN" = "null" ] || [ -z "$NEW_TOKEN" ]; then
            echo "::error::Failed to create new Linode token"
            echo "$RESPONSE" | jq .
            exit 1
          fi

          # Update GitHub secret
          python3 - <<'PYTHON'
          import json, os, base64
          from nacl import encoding, public
          import urllib.request

          def encrypt_secret(public_key: str, secret_value: str) -> str:
              pk = public.PublicKey(public_key.encode("utf-8"), encoding.Base64Encoder())
              sealed = public.SealedBox(pk).encrypt(secret_value.encode("utf-8"))
              return base64.b64encode(sealed).decode("utf-8")

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}

          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/secrets/public-key", headers=headers)
          key_data = json.loads(urllib.request.urlopen(req).read())

          encrypted = encrypt_secret(key_data["key"], os.environ["NEW_TOKEN"])
          data = json.dumps({"encrypted_value": encrypted, "key_id": key_data["key_id"]}).encode()
          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/secrets/LI_API_TOKEN", data=data, headers={**headers, "Content-Type": "application/json"}, method="PUT")
          urllib.request.urlopen(req)
          print("✓ LI_API_TOKEN updated")
          PYTHON

          # Delete old token using new token
          OLD_TOKENS=$(curl -s "https://api.linode.com/v4/profile/tokens" \
            -H "Authorization: Bearer $NEW_TOKEN" | jq -r ".data[] | select(.id != $NEW_TOKEN_ID and (.label | startswith(\"searxng-pipeline-\"))) | .id")
          for OLD_ID in $OLD_TOKENS; do
            curl -s -X DELETE "https://api.linode.com/v4/profile/tokens/$OLD_ID" \
              -H "Authorization: Bearer $NEW_TOKEN"
            echo "✓ Deleted old Linode token $OLD_ID"
          done

      - name: Rotate Cloudflare API Token
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_TOKEN_ID: ${{ vars.CF_API_TOKEN_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Roll the token — returns new value, old value invalidated
          RESPONSE=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/user/tokens/$CF_TOKEN_ID/value" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}')

          NEW_TOKEN=$(echo "$RESPONSE" | jq -r '.result')
          if [ "$NEW_TOKEN" = "null" ] || [ -z "$NEW_TOKEN" ]; then
            echo "::error::Failed to roll Cloudflare API token"
            echo "$RESPONSE" | jq .
            exit 1
          fi

          export NEW_TOKEN
          python3 - <<'PYTHON'
          import json, os, base64
          from nacl import encoding, public
          import urllib.request

          def encrypt_secret(public_key: str, secret_value: str) -> str:
              pk = public.PublicKey(public_key.encode("utf-8"), encoding.Base64Encoder())
              sealed = public.SealedBox(pk).encrypt(secret_value.encode("utf-8"))
              return base64.b64encode(sealed).decode("utf-8")

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}

          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/secrets/public-key", headers=headers)
          key_data = json.loads(urllib.request.urlopen(req).read())

          encrypted = encrypt_secret(key_data["key"], os.environ["NEW_TOKEN"])
          data = json.dumps({"encrypted_value": encrypted, "key_id": key_data["key_id"]}).encode()
          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/secrets/CF_API_TOKEN", data=data, headers={**headers, "Content-Type": "application/json"}, method="PUT")
          urllib.request.urlopen(req)
          print("✓ CF_API_TOKEN updated")
          PYTHON

      - name: Trigger deploy with new secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          curl -s -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/dispatches" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"ref":"main"}'
          echo "✓ Deploy triggered"
